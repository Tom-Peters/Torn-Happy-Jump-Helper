name: Happy Jump Helper checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and unit tests
        run: |
          node --check Torn-Happy-Jump-Helper-v0.11.0-preview.user.js
          node --check Torn-Happy-Jump-Helper-v0.11.1-preview.user.js
          node --check Torn-Happy-Jump-Helper-preview.user.js
          npm run check
          node --check Torn-Happy-Jump-Helper-v0.10.9-compat.user.js
          node --check Torn-Happy-Jump-Helper-v0.10.10-compat.user.js
          node --check Torn-Happy-Jump-Helper-v0.10.11-compat.user.js
          node --check Torn-Happy-Jump-Helper-v0.10.12-compat.user.js
          node --check Torn-Happy-Jump-Helper-v0.10.13-compat.user.js
          node --check Torn-Happy-Jump-Helper-v0.10.14-compat.user.js
          node --check Torn-Happy-Jump-Helper-v0.10.15-compat.user.js
          node --check Torn-Happy-Jump-Helper-v0.10.16-compat.user.js
          node --check Torn-Happy-Jump-Helper-v0.10.17-compat.user.js
          node --check Torn-Happy-Jump-Helper-v0.10.18-compat.user.js
          node --check Torn-Happy-Jump-Helper-v0.10.19-compat.user.js
          node --check Torn-Happy-Jump-Helper-v0.10.20-compat.user.js
          node --check Torn-Happy-Jump-Helper-v0.10.21-compat.user.js
          node --check Torn-Happy-Jump-Helper-v0.10.22-compat.user.js
          node --check Torn-Happy-Jump-Helper-v0.11.0-preview.user.js
          node --check Torn-Happy-Jump-Helper-v0.11.1-preview.user.js
      - name: Reject mutation-capable PDA request handlers
        run: |
          if grep -En 'PDA_http(Post|Put|Patch|Delete)\(' Torn-Happy-Jump-Helper.user.js; then
            echo "Mutation-capable PDA request handler detected" >&2
            exit 1
          fi
